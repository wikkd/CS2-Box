name: Build Matrix

on:
  push:
    branches: [main, multiloader-refactor]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.mc }} (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: 1.21.1
            version_key: 1.21.1
            module: v1_21_1
            java: 21
          - mc: 26.1.2
            version_key: 26.1.2
            module: v26_1_2
            java: 25
          - mc: 26.2
            version_key: 26.2
            module: v26_2
            java: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.mc }}-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download TACZ compileOnly jar (v1_21_1 inspect viewport)
        if: matrix.module == 'v1_21_1'
        run: scripts/download-tacz.sh

      - name: Compile ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:compileJava -Pactive_versions=${{ matrix.version_key }} --console=plain

      - name: Run platform smoke tests (${{ matrix.module }})
        if: matrix.module == 'v26_1_2'
        run: ./gradlew :${{ matrix.module }}:test -Pactive_versions=${{ matrix.version_key }} --console=plain

      - name: Assemble jar
        run: ./gradlew :${{ matrix.module }}:jar -Pactive_versions=${{ matrix.version_key }} --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: csgobox-${{ matrix.mc }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error

  common-test:
    name: common unit tests + checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-common-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-common-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check version sync (gradle.properties / CHANGELOG / README / mods.toml)
        run: scripts/check-version.sh

      - name: Check AnimRenderOps drift (3 platforms)
        run: scripts/check-animops-drift.sh

      - name: Architecture constraint check (CONSTRAINT-001)
        run: ./gradlew :common:checkCommonArchitecture --console=plain

      - name: Run common unit tests
        run: ./gradlew :common:test --console=plain
