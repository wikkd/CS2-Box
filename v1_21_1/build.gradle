// ProGuard minify is opt-in: shrink-only (no obfuscation), invoked via
// ./gradlew :v1_21_1:minifyJar -Pactive_versions=1.21.1. Output lands in
// build/libs/csgobox-1.21.1-<version>-minified.jar and is never part of
// the default build. High-risk: mis-shrinking a reflectively-called
// method surfaces as a runtime NoSuchMethodError on the player's client.
// Keep proguard-rules.pro in sync with every new @SubscribeEvent / @Mod /
// EventBusSubscriber / CustomPacketPayload addition; the class-list audit
// (scripts/slim-audit-classes.py) is the hard gate.
//
// ProGuard is run through its standalone main class (proguard.ProGuard)
// via JavaExec because the ProGuard Gradle plugin (7.4.2) conflicts with
// Gradle's strict plugins{} block ordering and ProGuard ships Maven-only
// artifacts. The proguard-base 7.9.1 dependency lives on the
// proguardTool configuration below, not the buildscript classpath.

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version "${neogradle_version_1_21_1}"
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-${mc_version_1_21_1}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_toolchain_version as int)
    }
}

def jdk21 = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(java_toolchain_version as int)
}

tasks.withType(JavaExec).configureEach {
    executable = jdk21.get().executablePath.asFile.path
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    data {
        arguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir project(':common').file('src/main/resources')
}

sourceSets.main.java {
    srcDir project(':common').file('src/main/java')
}

repositories {
    maven {
        name = 'LocalPatchedLibraries'
        url = rootProject.file('local-repo')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven { url = 'https://maven.neoforged.net/releases' }
    // Mojang libraries host hosts the patched lwjgl-freetype natives
    // (lwjgl-freetype-3.3.3-natives-macos-patch.jar) required by NeoForm.
    maven { url = 'https://libraries.minecraft.net' }
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://modmaven.dev' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://www.cursemaven.com' }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    // EMI — published through the Modrinth Maven (group maven.modrinth).
    maven {
        name = 'ModrinthMaven'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'BaiMaven'
        url = 'https://maven4.bai.lol'
        content {
            includeGroup 'mcp.mobius.waila'
        }
    }
    maven {
        name = 'McjtyMaven'
        url = 'https://maven.k-4u.nl'
        content {
            includeGroup 'mcjty.theoneprobe'
        }
    }
}

dependencies {
    implementation project(':common')
    implementation "net.neoforged:neoforge:${neo_version_1_21_1}"
    // TACZ (Timeless & Classics Guns: Zero, unofficial 1.21.1 port) — optional
    // compileOnly dependency for the CsLookItemScreen inspect viewport. The jar
    // is NOT committed (~57MB): run scripts/download-tacz.sh to populate
    // local-repo first. Guarded at runtime via ModList.isLoaded("tacz").
    compileOnly 'com.tacz:tacz:1.1.8-hotfix-r6'
    // Supertype (IFPGeoItemRenderer) of TACZ's AnimateGeoItemRenderer; extracted
    // from the TACZ jarjar bundle so javac can resolve the class hierarchy.
    compileOnly 'com.github.mcmodderanchor:simplebedrockmodel:2.2.1-neoforge+mc1.21.1'

    // Create (机械动力) — optional compileOnly for the official deployer
    // recipe integration (DeployerRecipeSearchEvent / ManualApplicationRecipe /
    // enforceNextResult). The jar is NOT committed (~19MB): copy your local
    // create-1.21.1-<v>.jar into local-repo/com/simibubi/create/create/<v>/
    // (with a minimal pom) before building; loading is optional at runtime.
    compileOnly 'com.simibubi.create:create:6.0.10'
    // Create's jar-in-jar bundles (ponder/flywheel/Registrate) are loaded by
    // NeoForge at runtime, but javac needs them on the compile classpath to
    // resolve DeployerBlockEntity's interfaces (net.createmod.ponder.api.*).
    // Extracted from META-INF/jarjar/ inside create-6.0.10.jar.
    compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'

    // JEI integration (optional client mod). compileOnly for the plugin API,
    // runtimeOnly so dev runs actually ship the JEI jar. Plugin discovery is
    // FML annotation scanning (@JeiPlugin), no ServiceLoader entry needed.
    compileOnly "mezz.jei:jei-${mc_version_1_21_1}-neoforge:${jei_version_1_21_1}"
    runtimeOnly "mezz.jei:jei-${mc_version_1_21_1}-neoforge:${jei_version_1_21_1}"

    // REI (Roughly Enough Items) integration (optional client mod).
    // compileOnly for the plugin API (pullsin cloth-config + architectury
    // transitively), runtimeOnly so dev runs ship the REI jar. Discovery is
    // @REIPluginClient annotation scanning (covers MEI, a REI fork, too).
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version_1_21_1}"
    runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version_1_21_1}"

    // Cloth Config (optional client config GUI). The screen is a thin
    // wrapper over the existing ModConfigSpec bindings — no storage change.
    // compileOnly for the API, runtimeOnly so dev runs ship the Cloth jar.
    // Runtime guard: ModList.isLoaded("cloth_config"); without it the mod
    // simply keeps the TOML-only workflow (no Configure button).
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version_1_21_1}"
    runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version_1_21_1}"

    // EMI integration (optional client mod; Modrinth Maven). compileOnly for
    // the plugin API, runtimeOnly so dev runs ship the EMI jar. Discovery is
    // @EmiEntrypoint annotation scanning on NeoForge (no ServiceLoader entry).
    // NOTE: the 26.x line has no EMI build, so only this module and
    // forge_1_20_1 carry EMI code.
    compileOnly "maven.modrinth:emi:${emi_version_1_21_1}"
    runtimeOnly "maven.modrinth:emi:${emi_version_1_21_1}"

    // Jade (hover information overlay) — optional client mod, Modrinth
    // Maven. compileOnly for the plugin API; discovery is @WailaPlugin
    // annotation scanning. No runtime jar needed for dev runs (optional).
    compileOnly "maven.modrinth:jade:${jade_version_1_21_1}"

    // WTHIT (hover information overlay) — optional client mod; compileOnly
    // against the published wthit-api artifact (bai.lol Maven).
    compileOnly "mcp.mobius.waila:wthit-api:${wthit_version_1_21_1}"

    // The One Probe — optional client mod; ":api" classifier from k-4u Maven.
    compileOnly "mcjty.theoneprobe:theoneprobe:${top_version_1_21_1}:api"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // TACZ stays compileOnly (tests never touch TACZ classes: pure functions +
    // injected fake validator), but must be on the test runtime classpath for
    // JVM lazy-resolution safety when BoxItemCodec is loaded in the test JVM.
    testRuntimeOnly 'com.tacz:tacz:1.1.8-hotfix-r6'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

def removeStaleBuildResources = { task ->
    def buildRes = layout.buildDirectory.dir("resources/main").get().asFile
    if (!buildRes.exists()) {
        return
    }
    def staleArtifacts = []
    buildRes.eachFileRecurse(groovy.io.FileType.ANY) { f ->
        if (f.name ==~ /.+[ ][0-9]+(\..+)?/ || f.name ==~ /.+\+[0-9]+(\..+)?/) {
            staleArtifacts << f
        }
    }
    staleArtifacts.sort { -it.path.length() }.each { f ->
        if (!f.exists()) {
            return
        }
        if (f.isDirectory()) {
            f.deleteDir()
        } else {
            f.delete()
        }
        task.logger.lifecycle("Removed stale build artifact: ${f}")
    }
}

def purgeStaleBuildResources = tasks.register('purgeStaleBuildResources') {
    doLast {
        removeStaleBuildResources(delegate)
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn purgeStaleBuildResources

    // gradle.properties 是 UTF-8；Java Properties 默认按 ISO-8859-1 解析，
    // 会使 description 中的中文在 expand 后双重编码乱码。用 UTF-8 显式重读覆盖。
    def utf8RootProps = new Properties()
    rootProject.file('gradle.properties').withReader('UTF-8') { reader -> utf8RootProps.load(reader) }

    var replaceProperties = [
            minecraft_version: mc_version_1_21_1,
            minecraft_version_range: mc_version_range_1_21_1,
            pack_format: pack_format_1_21_1,
            neo_version: neo_version_1_21_1,
            neo_version_range: neo_version_range_1_21_1,
            loader_version_range: loader_version_range_1_21_1,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: utf8RootProps.getProperty('mod_description'),
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${mc_version_1_21_1}-${version}.jar"
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
        ])
    }
    // Exclude anonymous/inner-class stubs left over by incremental javac when
    // a class is moved to a new package between source revisions. See
    // v26_1_2/build.gradle for the rationale.
    // Stale incremental-javac leftovers (anonymous-class revisions) appear as
    // "Foo 2.class" (space form) or "Foo+2.class" (plus form). Both predicates
    // mirror purgeStaleBuildResources so classes/ and resources/ are filtered
    // consistently.
    exclude { it.name ==~ /.+[ ][0-9]+(\..+)?/ || it.name ==~ /.+\+[0-9]+(\..+)?/ }
}

// The 1.0.6 cleanup pass reached -32% via clean + dedup + dead-code removal
// and rolled its ProGuard attempt back because the rules file used
// -keepclassmembers for annotation-discovered classes (silently dropping
// 9 functional classes) and referenced a non-existent annotation package
// (net.neoforged.bus.api.EventBusSubscriber). Those bugs are fixed: the
// rules now class-level-keep @net.neoforged.fml.common.EventBusSubscriber
// classes and add forge-specific entry points (see proguard-rules.pro).

// ProGuard minify task — produces a smaller jar alongside the unminified
// one (shrink-only: no obfuscation, no optimization). Invoked via:
// ./gradlew :v1_21_1:minifyJar
// -Pactive_versions=1.21.1
configurations {
    proguardTool
}
dependencies {
    proguardTool 'com.guardsquare:proguard-base:7.9.1'
}

tasks.register('minifyJar', JavaExec) {
    description = 'Minify the v1_21_1 mod jar with ProGuard (see proguard-rules.pro).'
    group = 'build'

    classpath = configurations.proguardTool
    mainClass = 'proguard.ProGuard'

    // Rebuild the unminified jar first: the minified output must always be
    // derived from the current source state (and the -Pslim debugLevel flag).
    dependsOn tasks.named('jar')

    def rules = rootProject.file('proguard-rules.pro')
    def unminified = tasks.named('jar').get().outputs.files.singleFile
    def minified = layout.buildDirectory.file("libs/${unminified.name.replace('.jar', '-minified.jar')}").get().asFile

    inputs.file unminified
    inputs.file rules
    outputs.file minified

    doFirst {
        def config = layout.buildDirectory.file("proguard-config.pro").get().asFile
        config.parentFile.mkdirs()
        // ProGuard 7.5+ accepts -libraryjars EITHER as a single classpath
        // string (':' on Linux/macOS, ';' on Windows) OR as multiple
        // arguments (one per -libraryjars line). The first form collides
        // with ProGuard's entrypoint parser treating the whole string as a
        // single path; the second form is the documented canonical way and
        // is what we emit here.
        def libs = configurations.runtimeClasspath.findAll { it.exists() }*.absolutePath
        StringBuilder sb = new StringBuilder()
        sb.append("-injars '").append(unminified.absolutePath).append("'\n")
        sb.append("-outjars '").append(minified.absolutePath).append("'\n")
        libs.each { path -> sb.append("-libraryjars '").append(path).append("'\n") }
        ['java.base.jmod', 'java.net.http.jmod'].each { name ->
            def jmod = new File(System.getProperty('java.home'), "jmods/${name}")
            if (jmod.exists()) {
                sb.append("-libraryjars '").append(jmod.absolutePath).append("'\n")
            }
        }
        sb.append("-include '").append(rules.absolutePath).append("'\n")
        sb.append("-dontoptimize\n-dontobfuscate\n-dontpreverify\n")
        sb.append("-dontskipnonpubliclibraryclasses\n-dontusemixedcaseclassnames\n")
        sb.append("-flattenpackagehierarchy ''\n-mergeinterfacesaggressively\n")
        sb.append("-keepattributes SourceFile\n")
        sb.append("-keepattributes LineNumberTable\n")
        sb.append("-keepattributes '*Annotation*'\n")
        sb.append("-keepattributes Signature\n")
        sb.append("-keepattributes InnerClasses\n")
        sb.append("-keepattributes EnclosingMethod\n")
        // No -ignorewarnings / -dontwarn ** here: missing classes must fail
        // the build instead of being silently swallowed. Any library that is
        // legitimately absent from the offline runtime classpath gets an
        // explicit -dontwarn entry in proguard-rules.pro.
        config.text = sb.toString()
        args '@' + config.absolutePath
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (project.hasProperty('slim')) {
        options.debugOptions.debugLevel = 'lines,source'
    }
}
