// ProGuard 7.5.0 standalone — minify the production jar to ~50% by
// stripping unused classes / methods / fields. High-risk: mis-shrinking
// a reflectively-called method will surface as a runtime
// NoSuchMethodError on the player's client. Keep proguard-rules.pro in
// sync with every new @SubscribeEvent / @Mod / @EventBusSubscriber /
// CustomPacketPayload addition; treat the minified jar as opt-in.
//
// We use ProGuard's standalone main class (proguard.ProGuard) via
// JavaExec rather than the ProGuard Gradle plugin, because the
// ProGuard plugin (7.4.2) conflicts with Gradle 8's strict
// plugins{} block ordering and ProGuard 7.5+ no longer ships a
// separately-executable jar (Maven-only). This way we feed the
// proguard-base 7.5.0 dependency directly to the task classpath.
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-base:7.5.0'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version "${neogradle_version_1_21_1}"
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-${mc_version_1_21_1}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_toolchain_version as int)
    }
}

def jdk21 = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(java_toolchain_version as int)
}

tasks.withType(JavaExec).configureEach {
    executable = jdk21.get().executablePath.asFile.path
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    data {
        arguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir project(':common').file('src/main/resources')
}

sourceSets.main.java {
    srcDir project(':common').file('src/main/java')
}

repositories {
    maven {
        name = 'LocalPatchedLibraries'
        url = rootProject.file('local-repo')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven { url = 'https://maven.neoforged.net/releases' }
    // Mojang libraries host hosts the patched lwjgl-freetype natives
    // (lwjgl-freetype-3.3.3-natives-macos-patch.jar) required by NeoForm.
    maven { url = 'https://libraries.minecraft.net' }
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://modmaven.dev' }
    maven { url = 'https://www.cursemaven.com' }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
}

dependencies {
    implementation project(':common')
    implementation "net.neoforged:neoforge:${neo_version_1_21_1}"
}

def removeStaleBuildResources = { task ->
    def buildRes = file("$buildDir/resources/main")
    if (!buildRes.exists()) {
        return
    }
    def staleArtifacts = []
    buildRes.eachFileRecurse(groovy.io.FileType.ANY) { f ->
        if (f.name ==~ /.+ [0-9]+(\..+)?/) {
            staleArtifacts << f
        }
    }
    staleArtifacts.sort { -it.path.length() }.each { f ->
        if (!f.exists()) {
            return
        }
        if (f.isDirectory()) {
            f.deleteDir()
        } else {
            f.delete()
        }
        task.logger.lifecycle("Removed stale build artifact: ${f}")
    }
}

def purgeStaleBuildResources = tasks.register('purgeStaleBuildResources') {
    doLast {
        removeStaleBuildResources(delegate)
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn purgeStaleBuildResources

    var replaceProperties = [
            minecraft_version: mc_version_1_21_1,
            minecraft_version_range: mc_version_range_1_21_1,
            pack_format: pack_format_1_21_1,
            neo_version: neo_version_1_21_1,
            neo_version_range: neo_version_range_1_21_1,
            loader_version_range: loader_version_range_1_21_1,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${mc_version_1_21_1}-${version}.jar"
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    // Exclude anonymous/inner-class stubs left over by incremental javac when
    // a class is moved to a new package between source revisions. See
    // v26_1_2/build.gradle for the rationale.
    exclude '**/*+[0-9]+*'
}

// ProGuard / R8 minify was attempted in the 1.0.6 cleanup pass but rolled
// back: R8 outputs Android .dex bytecode (incompatible with mc 1.21.1's
// Java class loader), and ProGuard 7.x Gradle plugin (7.4.2) is
// incompatible with Gradle 8's strict plugins{} block ordering. ProGuard
// 7.5+ has no published standalone jar (Maven-only), so a manual
// java -cp invocation is the only route, and that crosses into
// engineering territory the ROI no longer justifies (we already reached
// -32% total size reduction via clean + dedup + dead-code removal).
//
// The keep rules written for that attempt are kept in
// /Users/shuangyuexingxun/Desktop/CS2-Box/proguard-rules.pro at the
// repository root for future reference if / when the toolchain catches up.

// ProGuard 7.5.0 minify task — produces a smaller jar alongside the
// unminified one. Invoked via: ./gradlew :v1_21_1:minifyJar
// -Pactive_versions=1.21.1
configurations {
    proguardTool
}
dependencies {
    proguardTool 'com.guardsquare:proguard-base:7.5.0'
}

tasks.register('minifyJar', JavaExec) {
    description = 'Minify the v1_21_1 mod jar with ProGuard 7.5.0 (see proguard-rules.pro).'
    group = 'build'

    classpath = configurations.proguardTool
    mainClass = 'proguard.ProGuard'

    def rules = rootProject.file('proguard-rules.pro')
    def unminified = tasks.named('jar').get().outputs.files.singleFile
    def minified = file("build/libs/${unminified.name.replace('.jar', '-minified.jar')}")

    inputs.file unminified
    inputs.file rules
    outputs.file minified

    doFirst {
        def config = file("build/proguard-config.pro")
        config.parentFile.mkdirs()
        // ProGuard 7.5+ accepts -libraryjars EITHER as a single classpath
        // string (':' on Linux/macOS, ';' on Windows) OR as multiple
        // arguments (one per -libraryjars line). The first form collides
        // with ProGuard's entrypoint parser treating the whole string as a
        // single path; the second form is the documented canonical way and
        // is what we emit here.
        def libs = configurations.runtimeClasspath.findAll { it.exists() }*.absolutePath
        StringBuilder sb = new StringBuilder()
        sb.append("-injars '").append(unminified.absolutePath).append("'\n")
        sb.append("-outjars '").append(minified.absolutePath).append("'\n")
        libs.each { path -> sb.append("-libraryjars '").append(path).append("'\n") }
        sb.append("-include '").append(rules.absolutePath).append("'\n")
        sb.append("-dontoptimize\n-dontobfuscate\n-dontpreverify\n")
        sb.append("-dontskipnonpubliclibraryclasses\n-dontusemixedcaseclassnames\n")
        sb.append("-flattenpackagehierarchy ''\n-mergeinterfacesaggressively\n")
        sb.append("-keepattributes SourceFile\n")
        sb.append("-keepattributes LineNumberTable\n")
        sb.append("-keepattributes '*Annotation*'\n")
        sb.append("-keepattributes Signature\n")
        sb.append("-keepattributes InnerClasses\n")
        sb.append("-keepattributes EnclosingMethod\n")
        // ProGuard 7.5 strict: unresolved class refs are an error, not a
        // warning. The mod's -keepclassmembers enum `*` rule pulls in
        // constants from neoForm 1.21.1-20240808.144430.zip and a few
        // pieces of jna / asyncutil that the offline runtime classpath
        // does not surface — those are all jar-in-jar resources in
        // production. We accept them here so we can measure the minified
        // size; any runtime NPE after deployment is a separate
        // investigation that will land new -keep rules in proguard-rules.pro.
        sb.append("-ignorewarnings\n-dontwarn **\n")
        config.text = sb.toString()
        args '@' + config.absolutePath
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
