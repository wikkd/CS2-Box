plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version "${neogradle_version_26_1_2}"
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-${mc_version_26_1_2}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def jdk25 = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaExec).configureEach {
    executable = jdk25.get().executablePath.asFile.path
    jvmArgs += '--enable-preview'
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'src/main/resources'
    srcDir project(':common').file('src/main/resources')
}

sourceSets.main.java {
    srcDir project(':common').file('src/main/java')
}

// Multiple srcDirs in sourceSets.main.resources can collide on files like
// META-INF/neoforge.mods.toml (declared both in v26_1_2 and in common via the
// auto-discovery path). Tell processResources to pick the first one written,
// which prefers the version-specific assets in src/main/resources over the
// shared common/ baseline.
tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    maven {
        name = 'LocalPatchedLibraries'
        url = rootProject.file('local-repo')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven { url = 'https://maven.neoforged.net/releases' }
    // Mojang libraries host hosts the patched lwjgl-freetype natives
    // (lwjgl-freetype-3.3.3-natives-macos-patch.jar) required by NeoForm.
    maven { url = 'https://libraries.minecraft.net' }
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://modmaven.dev' }
    maven { url = 'https://www.cursemaven.com' }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
}

dependencies {
    implementation project(':common')
    implementation "net.neoforged:neoforge:${neo_version_26_1_2}"

    // JEI integration (optional client mod). compileOnly for the plugin API,
    // runtimeOnly so dev runs actually ship the JEI jar.
    compileOnly "mezz.jei:jei-${mc_version_26_1_2}-neoforge:${jei_version_26_1_2}"
    runtimeOnly "mezz.jei:jei-${mc_version_26_1_2}-neoforge:${jei_version_26_1_2}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // main classes are compiled with --enable-preview (Java 25), so the test
    // JVM must enable preview too when it loads them.
    jvmArgs += ['--enable-preview']
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

def removeStaleBuildResources = { task ->
    def buildRes = file("$buildDir/resources/main")
    if (!buildRes.exists()) {
        return
    }
    def staleArtifacts = []
    buildRes.eachFileRecurse(groovy.io.FileType.ANY) { f ->
        if (f.name ==~ /.+ [0-9]+(\..+)?/) {
            staleArtifacts << f
        }
    }
    staleArtifacts.sort { -it.path.length() }.each { f ->
        if (!f.exists()) {
            return
        }
        if (f.isDirectory()) {
            f.deleteDir()
        } else {
            f.delete()
        }
        task.logger.lifecycle("Removed stale build artifact: ${f}")
    }
}

def purgeStaleBuildResources = tasks.register('purgeStaleBuildResources') {
    doLast {
        removeStaleBuildResources(delegate)
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn purgeStaleBuildResources

    var replaceProperties = [
            minecraft_version: mc_version_26_1_2,
            minecraft_version_range: mc_version_range_26_1_2,
            pack_format: pack_format_26_1_2,
            neo_version: neo_version_26_1_2,
            neo_version_range: neo_version_range_26_1_2,
            loader_version_range: loader_version_range_26_1_2,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${mc_version_26_1_2}-${version}.jar"
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    // Exclude anonymous/inner-class stubs left over by incremental javac when
    // a class is moved to a new package between source revisions (e.g. the
    // v1.0.5 -> v1.0.6 common/ migration rewrote IGuiGraphics / IRegistry
    // / IAttachmentRegistrar etc., and the * 2.class / * 3.class / * 4.class
    // / * 5.class stale copies accumulated in build/classes/ — that single
    // regression pushed the v26_1.2 jar from 370 KB to 832 KB without any
    // feature change). The pattern matches "<path>/<ClassName> <N>.<ext>"
    // which is javac's anonymous-class naming convention.
    exclude '**/*+[0-9]+*'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['--enable-preview']
    if (project.hasProperty('slim')) {
        options.debugOptions.debugLevel = 'lines,source'
    }
}

// ProGuard minify task — produces a smaller jar alongside the unminified
// one (shrink-only: no obfuscation, no optimization). Invoked via:
// ./gradlew :v26_1_2:minifyJar -Pactive_versions=26.1.2
configurations {
    proguardTool
}
dependencies {
    proguardTool 'com.guardsquare:proguard-base:7.9.1'
}

tasks.register('minifyJar', JavaExec) {
    description = 'Minify the v26_1_2 mod jar with ProGuard (see proguard-rules.pro).'
    group = 'build'

    classpath = configurations.proguardTool
    mainClass = 'proguard.ProGuard'

    // Rebuild the unminified jar first: the minified output must always be
    // derived from the current source state (and the -Pslim debugLevel flag).
    dependsOn tasks.named('jar')

    def rules = rootProject.file('proguard-rules.pro')
    def unminified = tasks.named('jar').get().outputs.files.singleFile
    def minified = file("build/libs/${unminified.name.replace('.jar', '-minified.jar')}")

    inputs.file unminified
    inputs.file rules
    outputs.file minified

    doFirst {
        def config = file("build/proguard-config.pro")
        config.parentFile.mkdirs()
        def libs = configurations.runtimeClasspath.findAll { it.exists() }*.absolutePath
        StringBuilder sb = new StringBuilder()
        sb.append("-injars '").append(unminified.absolutePath).append("'\n")
        sb.append("-outjars '").append(minified.absolutePath).append("'\n")
        libs.each { path -> sb.append("-libraryjars '").append(path).append("'\n") }
        ['java.base.jmod', 'java.net.http.jmod'].each { name ->
            def jmod = new File(System.getProperty('java.home'), "jmods/${name}")
            if (jmod.exists()) {
                sb.append("-libraryjars '").append(jmod.absolutePath).append("'\n")
            }
        }
        sb.append("-include '").append(rules.absolutePath).append("'\n")
        sb.append("-dontoptimize\n-dontobfuscate\n-dontpreverify\n")
        sb.append("-dontskipnonpubliclibraryclasses\n-dontusemixedcaseclassnames\n")
        sb.append("-flattenpackagehierarchy ''\n-mergeinterfacesaggressively\n")
        sb.append("-keepattributes SourceFile\n")
        sb.append("-keepattributes LineNumberTable\n")
        sb.append("-keepattributes '*Annotation*'\n")
        sb.append("-keepattributes Signature\n")
        sb.append("-keepattributes InnerClasses\n")
        sb.append("-keepattributes EnclosingMethod\n")
        // No -ignorewarnings / -dontwarn ** here: missing classes must fail
        // the build instead of being silently swallowed. Any library that is
        // legitimately absent from the offline runtime classpath gets an
        // explicit -dontwarn entry in proguard-rules.pro.
        config.text = sb.toString()
        args '@' + config.absolutePath
    }
}
