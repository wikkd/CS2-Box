plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    // Pinned ForgeGradle (NOT the dynamic [7.0.17,8) range): the range floats
    // to the newest plugin marker and silently changed behavior across builds
    // (e.g. 7.0.35 forced the SlimeLauncher runsJson workaround below).
    // 7.0.34 verified 2026-08-14; bump only via gradle.properties.
    id 'net.minecraftforge.gradle' version "${forgegradle_version_forge_26_1_2}"
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-forge-${mc_version_forge_26_1_2}"
}

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            // macOS 上 LWJGL/GLFW 的 earlydisplay 要求 JVM 以主线程启动（-XstartOnFirstThread）。
            // NeoForge 的 run 配置自带该参数，forge 的 Slime Launcher 默认不带，需显式补上。
            if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')) {
                jvmArgs '-XstartOnFirstThread'
            }
        }

        register('client') {
            // 多 agent 并行隔离: -PgameDir=<dir> 覆盖 runClient 的 gameDir（默认 run）
            if (project.hasProperty('gameDir')) {
                workingDir = project.file(project.property('gameDir'))
            }
        }

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'src/main/resources'
    srcDir project(':common').file('src/main/resources')
}

sourceSets.main.java {
    srcDir project(':common').file('src/main/java')
}

// Multiple srcDirs can collide on files like META-INF/mods.toml.
tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven {
        name = 'LocalPatchedLibraries'
        url = rootProject.file('local-repo')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    mavenCentral()
    // Cloth Config (optional client config GUI) — published on the
    // shedaniel Maven (same host as REI); used by the NeoForge 26.x line.
    maven {
        name = 'ShedanielMaven'
        url = 'https://maven.shedaniel.me'
    }
    // WTHIT (hover information overlay) — optional client mod; the api
    // artifact resolves from the official bai.lol Maven.
    maven {
        name = 'BaiMaven'
        url = 'https://maven4.bai.lol'
        content {
            includeGroup 'mcp.mobius.waila'
        }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${mc_version_forge_26_1_2}-${forge_version_26_1_2}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'

    // WTHIT (hover information overlay) — optional client mod. compileOnly
    // against the published wthit-api artifact (bai.lol Maven); discovery is
    // the root waila_plugins.json entry. This is the ONLY hover/recipe-info
    // integration on the 26.x Forge modules (JEI/REI/EMI/Jade/TOP have no
    // 26.x Forge builds).
    compileOnly "mcp.mobius.waila:wthit-api:${wthit_version_forge_26_1_2}"

    // Cloth Config (optional client config GUI). The 26.x line publishes a
    // single "-neoforge" artifact shared by NeoForge and Forge (same
    // convention as REI 26.x), so the Forge modules reuse the neoforge
    // coordinates. compileOnly for the API; the dev run ships the Cloth jar
    // via runtimeOnly. Runtime guard: ModList.isLoaded("cloth_config");
    // without it the mod keeps the TOML-only workflow.
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version_forge_26_1_2}"
    runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version_forge_26_1_2}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

tasks.named('processResources', ProcessResources).configure {
    // gradle.properties 是 UTF-8；Java Properties 默认按 ISO-8859-1 解析，
    // 会使 description 中的中文在 expand 后双重编码乱码。用 UTF-8 显式重读覆盖。
    def utf8RootProps = new Properties()
    rootProject.file('gradle.properties').withReader('UTF-8') { reader -> utf8RootProps.load(reader) }

    var replaceProperties = [
            minecraft_version: mc_version_forge_26_1_2,
            minecraft_version_range: minecraft_version_range_forge_26_1_2,
            pack_format: pack_format_forge_26_1_2,
            forge_version: forge_version_26_1_2,
            forge_version_range: forge_version_range_26_1_2,
            loader_version_range: loader_version_range_forge_26_1_2,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: utf8RootProps.getProperty('mod_description'),
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-forge-${mc_version_forge_26_1_2}-${version}.jar"
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
        ])
    }
    // Stale incremental-javac leftovers (anonymous-class revisions) appear as
    // "Foo 2.class" (space form) or "Foo+2.class" (plus form). Both predicates
    // mirror purgeStaleBuildResources so classes/ and resources/ are filtered
    // consistently.
    exclude { it.name ==~ /.+[ ][0-9]+(\..+)?/ || it.name ==~ /.+\+[0-9]+(\..+)?/ }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (project.hasProperty('slim')) {
        options.debugOptions.debugLevel = 'lines,source'
    }
}

// ProGuard minify task — produces a smaller jar alongside the unminified
// one (shrink-only: no obfuscation, no optimization). Invoked via:
// ./gradlew :forge_26_1_2:minifyJar -Pactive_versions=forge-26.1.2
configurations {
    proguardTool
}
dependencies {
    proguardTool 'com.guardsquare:proguard-base:7.9.1'
}

tasks.register('minifyJar', JavaExec) {
    description = 'Minify the forge_26_1_2 mod jar with ProGuard (see proguard-rules.pro).'
    group = 'build'

    classpath = configurations.proguardTool
    mainClass = 'proguard.ProGuard'

    // Rebuild the unminified jar first: the minified output must always be
    // derived from the current source state (and the -Pslim debugLevel flag).
    dependsOn tasks.named('jar')

    def rules = rootProject.file('proguard-rules.pro')
    def unminified = tasks.named('jar').get().outputs.files.singleFile
    def minified = layout.buildDirectory.file("libs/${unminified.name.replace('.jar', '-minified.jar')}").get().asFile

    inputs.file unminified
    inputs.file rules
    outputs.file minified

    doFirst {
        def config = layout.buildDirectory.file("proguard-config.pro").get().asFile
        config.parentFile.mkdirs()
        def libs = configurations.runtimeClasspath.findAll { it.exists() }*.absolutePath
        StringBuilder sb = new StringBuilder()
        sb.append("-injars '").append(unminified.absolutePath).append("'\n")
        sb.append("-outjars '").append(minified.absolutePath).append("'\n")
        libs.each { path -> sb.append("-libraryjars '").append(path).append("'\n") }
        ['java.base.jmod', 'java.net.http.jmod'].each { name ->
            def jmod = new File(System.getProperty('java.home'), "jmods/${name}")
            if (jmod.exists()) {
                sb.append("-libraryjars '").append(jmod.absolutePath).append("'\n")
            }
        }
        sb.append("-include '").append(rules.absolutePath).append("'\n")
        sb.append("-dontoptimize\n-dontobfuscate\n-dontpreverify\n")
        sb.append("-dontskipnonpubliclibraryclasses\n-dontusemixedcaseclassnames\n")
        sb.append("-flattenpackagehierarchy ''\n-mergeinterfacesaggressively\n")
        sb.append("-keepattributes SourceFile\n")
        sb.append("-keepattributes LineNumberTable\n")
        sb.append("-keepattributes '*Annotation*'\n")
        sb.append("-keepattributes Signature\n")
        sb.append("-keepattributes InnerClasses\n")
        sb.append("-keepattributes EnclosingMethod\n")
        // No -ignorewarnings / -dontwarn ** here: missing classes must fail
        // the build instead of being silently swallowed. Any library that is
        // legitimately absent from the offline runtime classpath gets an
        // explicit -dontwarn entry in proguard-rules.pro.
        config.text = sb.toString()
        args '@' + config.absolutePath
    }
}

// WORKAROUND (ForgeGradle 7.0.35 + Gradle 9.5.1): ForgeGradle's
// slimeLauncherMetadataForForge task declares runsJson (@OutputFile) derived
// from the task's own outputDirectory (@OutputDirectory). Gradle 9.5.1 forbids
// querying a task's own output during output resolution, so the task fails
// validation before it ever runs. Point runsJson at a stable,
// non-self-referential path to break the cycle. (forge_1_20_1 pins 7.0.31 and
// is unaffected.)
def slimeRunsJsonDir = layout.buildDirectory
tasks.configureEach {
    if (name == 'slimeLauncherMetadataForForge') {
        runsJson.set(slimeRunsJsonDir.file("minecraftforge/forgegradle/${name}/runs.json"))
    }
}
