# ============================================================
# 26.2 version (v26_2 module) — values verified against
# https://maven.neoforged.net/releases/ on 2026-07-01.
#
# - Minecraft 26.2 is real but still in beta — NeoForge latest is
#   26.2.0.7-beta (no 26.2.0 stable yet). 26.2.0.4/0.5 skipped in
#   the published sequence.
# - NeoForm matching release is 26.2-1 (stable).
# - NeoGradle userdev latest is 7.1.38 (no 7.2.x published yet) —
#   same as v26_1_2 / v1_21_1.
# - loader_version_range stays [11,) — FML 11.0.13 referenced by
#   the NeoForge 26.2.0.7-beta POM is the same as 26.1.2.76.
# - pack_format estimated at 81 (Mojang convention +1 per minor;
#   26.1.x uses 80). v26_2/build.gradle substitutes this into
#   pack.mcmeta; Minecraft will log a warning if the value is off
#   but the game still loads.
# ============================================================
mc_version_26_2=26.2
mc_version_range_26_2=[26.2,26.3)
neo_version_26_2=26.2.0.7-beta
neo_version_range_26_2=[26.2,)
loader_version_range_26_2=[11,)
mapping_channel_26_2=official
mapping_version_26_2=26.2
neogradle_version_26_2=7.1.38
pack_format_26_2=81

# ============================================================
