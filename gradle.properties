# ForgeGradle 7 (forge_26_1_2): merge source-set classes+resources into
# build/sourceSets/main for dev runs (official MDK setting). Without this the
# classpath locator only sees META-INF/mods.toml in build/resources/main and
# fails with "constructed 0 mods".
net.minecraftforge.gradle.merge-source-sets=true

# ============================================================
# Mod metadata (cross-version)
# ============================================================
mod_id=csgobox
mod_name=CS2 Box
mod_license=MIT
mod_version=1.0.6
mod_group_id=com.reclizer
mod_authors=Reclizer (Original), ChloePrime (This version)
mod_description=CS2 Box brings CS:GO-style crate opening into Minecraft. Grab a crate and a matching key with /give, right-click to peek inside, drop the key into the slot, and hit Open. The server rolls the result for real, and the client only plays a short rolling animation that flips through the rarity tiers before landing on what you get. No real money involved - it is all in-game.\n\nEverything is built around five rarity tiers (Consumer through Classified), each with a weight you can tune in the JSON under config/csbox. You can add your own crates the same way, no recompiling. Keys come in four steps - iron, gold, diamond, and netherite - and the last one only comes from a smithing table. There is an achievement for your first open plus a hidden one for 200, and /csbox lets you inspect crates, reload config, and dump the NBT of any item in hand to paste straight into a crate file.\n\nThis is a cleaned-up, maintained fork of the original CsgoBox mod by Reclizer. Compared with the original it reworks the UI, fixes a known exploit, and rewrites NBT handling so nothing needs CraftTweaker. It is built as a multi-loader project, so one codebase covers NeoForge 1.21.1, 26.1.2 and 26.2 plus an experimental Forge build - but the Forge line is still a work in progress.\n\nInfo: some of the code, art and writing here were generated with AI and reviewed before shipping. It plays fine; this is just so you know parts were machine-written.\n\nCS2 Box 把 CS:GO 那种开箱抽奖搬进了 Minecraft。用 /give 拿到一个箱子配上对应等级的钥匙，右键看看里面有什么，把钥匙塞进卡槽点开启。结果由服务端真随机决定，客户端只是放一段滚动的揭晓动画，一档档翻过去，最后停在属于你的那件战利品上。不用花真钱，全在游戏里解决。\n\n核心就一句话：开箱，抽奖，收着。整套围绕 5 档稀有度展开（从 Consumer 到 Classified），每档权重都能在 config/csbox 下的 JSON 里调。你可以用同样方式加自己的箱子，不用重新编译。钥匙分四档：铁、金、钻石、下界合金，最高那档只能靠锻造台升出来。首次开箱和累计开 200 箱的隐藏成就都内置了，/csbox 命令能查箱子、重载配置，还能把手里物品的 NBT 导成 JSON 直接贴进箱子文件。\n\n这是原版 CsgoBox（作者 Reclizer）的重制维护版。相比原版，它重做了界面、修复了一个已知漏洞，并重写了 NBT 处理，让整套不再依赖 CraftTweaker。项目是多加载器结构，一套代码同时覆盖 NeoForge 1.21.1 / 26.1.2 / 26.2 以及一个实验性的 Forge 版本——不过 Forge 那条线还在打磨中，请留意。\n\n说明一下：这里有一部分代码、贴图和文案是 AI 生成的，发布前已经人工过了一遍。玩起来没问题，提这句只是想让大家知道有些部分是机器写的。

