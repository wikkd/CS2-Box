org.gradle.jvmargs=-Xmx3G
# 保持 daemon 关闭：本仓库常有多 agent / 多 shell 并行构建（多 agent 隔离），
# 常驻 daemon 会互相争抢内存并持有文件锁。CI 与本地均为"一进程一构建"模型，
# 关闭 daemon 的冷启动代价可接受（配合下方 parallel + caching 已足够）。
# 如需更快的本地迭代，可在命令行显式传 --daemon（或临时改为 true）。
org.gradle.daemon=false
# 跨模块并行 + 构建缓存（jar 时间戳已改确定性来源，缓存可命中）。
org.gradle.parallel=true
org.gradle.caching=true
# JDK 定位交给 Gradle toolchain / JAVA_HOME（foojay-resolver-convention 自动下载）；
# 不要在此写机器特定绝对路径（曾导致跨平台构建读到本机路径而失败）。

# ForgeGradle 7 (forge_26_1_2): merge source-set classes+resources into
# build/sourceSets/main for dev runs (official MDK setting). Without this the
# classpath locator only sees META-INF/mods.toml in build/resources/main and
# fails with "constructed 0 mods".
net.minecraftforge.gradle.merge-source-sets=true

# ============================================================
# Mod metadata (cross-version)
# ============================================================
mod_id=csgobox
mod_name=CS2 Box
mod_license=MIT
# ⚠️ 版本号变更铁律：未经维护者明确给出新版本号，严禁修改 mod_version
# （改版本 = 发布动作）。教程文件名与它强耦合（_tutorial_v<版本>*.md，运行时
# 按 jar 清单版本号下载），变更前必须先在 docs/tutorials/ 备好对应文件，
# 见 docs/RELEASE.md §5 与 AGENTS.md「版本号变更铁律」。
mod_version=2.0.2
mod_group_id=com.reclizer
mod_authors=Reclizer (Original), ChloePrime (This version)
mod_description=CS2 Box brings CS:GO-style crate opening into Minecraft. Grab a crate and a matching key with /give, right-click to peek inside, drop the key into the slot, and hit Open. The server rolls the result for real; the client only plays a short rolling animation through the rarity tiers before landing on your loot. No real money involved - it is all in-game.\n\nEverything centers on five rarity tiers (Consumer through Classified), each with a weight you can tune in the JSON under config/csbox. Add your own crates the same way - no recompiling. Keys come in four steps - iron, gold, diamond, and netherite - and netherite only comes from a smithing table. Achievements cover your first open plus a hidden one at 200, and /csbox lets you inspect crates, reload config, and dump hand-item NBT straight into a crate file. Bulk opening is there too, so you can clear a stack of crates in one go.\n\nThis is a cleaned-up, maintained fork of Reclizer's original CsgoBox: the UI is reworked, a known exploit is fixed, and NBT handling is rewritten so nothing needs CraftTweaker. One codebase covers all six released platforms - NeoForge 1.21.1 / 26.1.2 / 26.2 and Forge 1.20.1 / 26.1.2 / 26.2.\n\nNote: some code, art and writing here were AI-generated and reviewed before shipping. It plays fine; this is just so you know parts were machine-written.\n\nCS2 Box 把 CS:GO 那种开箱抽奖搬进 Minecraft。用 /give 拿到箱子配上对应等级的钥匙，右键看看里面有什么，把钥匙塞进卡槽点开启。结果由服务端真随机决定，客户端只放一段滚动的揭晓动画，一档档翻过去，最后停在属于你的那件战利品上。不用花真钱，全在游戏里解决。\n\n整套围绕 5 档稀有度展开（从 Consumer 到 Classified），每档权重都能在 config/csbox 下的 JSON 里调，也可以用同样方式加自己的箱子，不用重新编译。钥匙分四档：铁、金、钻石、下界合金，最高那档只能靠锻造台升出来。首次开箱和累计开 200 箱的隐藏成就都内置了，/csbox 命令能查箱子、重载配置，还能把手里物品的 NBT 导成 JSON 直接贴进箱子文件。批量开箱也支持，一次清空一批箱子。\n\n这是原版 CsgoBox（作者 Reclizer）的重制维护版：重做了界面、修复了一个已知漏洞、重写了 NBT 处理，整套不再依赖 CraftTweaker。项目是多加载器结构，一套代码覆盖六个正式发布平台——NeoForge 1.21.1 / 26.1.2 / 26.2 与 Forge 1.20.1 / 26.1.2 / 26.2。\n\n说明一下：这里有部分代码、贴图和文案是 AI 生成的，发布前已经人工过了一遍。玩起来没问题，只是让大家知道有些部分是机器写的。\n\nTutorial: the config reference ships inside the mod jar and is copied into config/csbox/_tutorial_v<version>.md (EN) and _tutorial_v<version>_zh_cn.md (CN) on first launch — on both the server and the client, no network needed. Open the mods list, click this mod, then the Website (globe) button for the online copy.\n\n教程：配置文件参考随 mod 内置（离线可用），首次启动时服务端与客户端都会把它复制到 config/csbox/_tutorial_v<版本>.md 与 _tutorial_v<版本>_zh_cn.md。在模组列表点开本模组详情，再点地球（Website）按钮即可查看在线版。

