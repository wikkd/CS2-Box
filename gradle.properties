org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home
org.gradle.java.installations.paths=/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home

# ForgeGradle 7 (forge_26_1_2): merge source-set classes+resources into
# build/sourceSets/main for dev runs (official MDK setting). Without this the
# classpath locator only sees META-INF/mods.toml in build/resources/main and
# fails with "constructed 0 mods".
net.minecraftforge.gradle.merge-source-sets=true

