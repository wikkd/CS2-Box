plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    // Pinned to a concrete version instead of the dynamic range [7.0.17,8):
    // in offline / maven.minecraftforge.net-blocked environments the range
    // resolves to the newest plugin marker (e.g. 7.0.35) whose implementation
    // artifact may not be cached, breaking the build. Version lives in
    // gradle.properties (forgegradle_version_forge_1_20_1).
    id 'net.minecraftforge.gradle' version "${forgegradle_version_forge_1_20_1}"
    // SRG reobfuscation for the 1.20.1 production jar (official → SRG).
    // Forge 1.20.1 runs Minecraft with SRG names at runtime; without this,
    // released jars crash with NoSuchMethodError/NoSuchFieldError. See the
    // renamer.classes block below (MDKExamples obfuscation/fg7 pattern).
    id 'net.minecraftforge.renamer' version '1.1.7'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-forge-${mc_version_forge_1_20_1}"
}

// MC 1.20.1 ships Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')) {
                jvmArgs '-XstartOnFirstThread'
            }
        }
        register('client') {
            if (project.hasProperty('gameDir')) {
                workingDir = project.file(project.property('gameDir'))
            }
            if (project.hasProperty('skipAssets')) {
                // slime-launcher: 离线环境跳过资产下载（DISABLE_ASSETS 在 Main 类加载时静态初始化，必须是 JVM -D 参数；缺失文件运行时静默降级）
                jvmArgs '-Dnet.minecraftforge.launcher.skip.assets=true'
            }
        }
        register('server') {
            args '--nogui'
        }
        register('gameTestServer')
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'src/main/resources'
    srcDir project(':common').file('src/main/resources')
}

sourceSets.main.java {
    srcDir project(':common').file('src/main/java')
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven {
        name = 'LocalPatchedLibraries'
        url = rootProject.file('local-repo')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://modmaven.dev' }
    maven { url = 'https://maven.shedaniel.me' }
    // EMI — published through the Modrinth Maven (group maven.modrinth).
    maven {
        name = 'ModrinthMaven'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'BaiMaven'
        url = 'https://maven4.bai.lol'
        content {
            includeGroup 'mcp.mobius.waila'
        }
    }
    maven {
        name = 'McjtyMaven'
        url = 'https://maven.k-4u.nl'
        content {
            includeGroup 'mcjty.theoneprobe'
        }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${mc_version_forge_1_20_1}-${forge_version_forge_1_20_1}")

    // TACZ (Timeless & Classics Guns: Zero, official 1.20.1) — optional
    // compileOnly dependency for TACZ item validation + the CsLookItemScreen
    // inspect viewport. The jar is NOT committed (~55MB): run
    // scripts/download-tacz-1201.sh to populate local-repo first. Guarded at
    // runtime via ModList.isLoaded("tacz").
    compileOnly 'com.tacz:tacz:1.1.8-hotfix'
    // NOTE: TACZ is intentionally NOT a runtime dependency in the userdev run.
    // ForgeGradle 7 (mavenizer) runs the dev client with official-mapped names
    // (e.g. LivingEntity.tick()), but the production TACZ jar's mixin refmap
    // targets SRG names (LivingEntity.m_8119_) and FG7 has no fg.deobf to
    // remap dependency jars — the un-remapped jar crashes runClient with
    // "Critical injection failure" in tacz.mixins.json. To test TACZ in the
    // dev client, deploy the official-mapped copy produced by
    // scripts/remap-tacz-1201.sh into forge_1_20_1/run/mods instead.
    // Supertype (IFPGeoItemRenderer) of TACZ's AnimateGeoItemRenderer; extracted
    // from the TACZ jarjar bundle so javac can resolve the class hierarchy.
    compileOnly 'com.github.mcmodderanchor:simplebedrockmodel:2.2.2-forge+mc1.20.1'

    // Create (机械动力) — optional compileOnly, official deployer recipe API.
    // Copy create-1.20.1-<v>.jar (e.g. [机械动力] create-1.20.1-6.0.8.jar)
    // from the game's mods folder into local-repo/com/simibubi/create/create/<v>/
    // first. Guarded at runtime via ModList.isLoaded("create").
    compileOnly 'com.simibubi.create:create:6.0.8'
    // Create's jar-in-jar bundles (ponder/flywheel/Registrate/mixinextras) are
    // loaded by Forge at runtime, but javac needs them on the compile
    // classpath to resolve DeployerBlockEntity's interfaces (ponder API).
    // Extracted from META-INF/jarjar/ inside create-6.0.8.jar.
    compileOnly 'net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91'
    compileOnly 'dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5'
    compileOnly 'com.tterrag.registrate:Registrate:MC1.20-1.3.3'
    compileOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'

    // JEI (compileOnly — optional at runtime). The plugin code in the jei/
    // package compiles against common-api (forge-api only ships ForgeTypes).
    // Discovery at runtime is FML annotation scanning of @JeiPlugin.
    compileOnly "mezz.jei:jei-${mc_version_forge_1_20_1}-forge-api:${jei_version_forge_1_20_1}"
    compileOnly "mezz.jei:jei-${mc_version_forge_1_20_1}-common-api:${jei_version_forge_1_20_1}"
    // runtimeOnly 需显式 -PwithJei：userdev 环境下 JEI 构造报 NoSuchMethodError（I18n SRG 名未重映射），E2E 测试不需要 JEI
    if (project.hasProperty('withJei')) {
        runtimeOnly "mezz.jei:jei-${mc_version_forge_1_20_1}-forge:${jei_version_forge_1_20_1}"
    }

    // REI (Roughly Enough Items) integration (optional client mod).
    // compileOnly for the plugin API (pullsin cloth-config + architectury
    // transitively), runtimeOnly so dev runs ship the REI jar. Discovery is
    // @REIPluginClient annotation scanning (covers MEI, a REI fork, too).
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version_forge_1_20_1}"
    if (project.hasProperty('withRei')) {
        runtimeOnly "me.shedaniel:RoughlyEnoughItems-forge:${rei_version_forge_1_20_1}"
    }

    // EMI integration (optional client mod; Modrinth Maven). compileOnly for
    // the plugin API; discovery is @EmiEntrypoint annotation scanning. The
    // Modrinth Forge build is SRG-mapped for MC overrides, but every EMI API
    // method we call keeps its own name — like the JEI forge-api/common-api
    // artifacts, it compiles directly without fg.deobf (FG7's deobf() does not
    // accept a bare Maven notation). The runtime jar is only put on the dev
    // classpath behind -PwithEmi.
    compileOnly "maven.modrinth:emi:${emi_version_forge_1_20_1}"
    if (project.hasProperty('withEmi')) {
        runtimeOnly "maven.modrinth:emi:${emi_version_forge_1_20_1}"
    }

    // Jade — optional client mod, Modrinth Maven. compileOnly for the plugin
    // API; discovery is @WailaPlugin annotation scanning by Jade itself.
    compileOnly "maven.modrinth:jade:${jade_version_forge_1_20_1}"

    // WTHIT — optional client mod; compileOnly against wthit-api.
    compileOnly "mcp.mobius.waila:wthit-api:${wthit_version_forge_1_20_1}"

    // The One Probe — optional client mod; ":api" classifier.
    compileOnly "mcjty.theoneprobe:theoneprobe:${top_version_forge_1_20_1}:api"

    // Cloth Config (optional client config GUI). The screen is a thin
    // wrapper over the existing ForgeConfigSpec bindings — no storage change.
    // compileOnly for the API, runtimeOnly so dev runs ship the Cloth jar.
    // Runtime guard: ModList.isLoaded("cloth_config"); without it the mod
    // simply keeps the TOML-only workflow (no Configure button).
    compileOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version_forge_1_20_1}"
    runtimeOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version_forge_1_20_1}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ===== SRG reobfuscation for the production jar (official → SRG) =====
// ForgeGradle 7's userdev client runs with official (Mojang/MCP) names, but a
// real Forge 1.20.1 client loads Minecraft with SRG names at runtime.  Jars
// built by plain `jar` keep official names, so the first call to a renamed
// Minecraft member crashes the game (the 2.0.0-beta reports:
// NoSuchMethodError CriteriaTriggers.register — SRG m_10595_).  This follows
// MinecraftForge/MDKExamples obfuscation/fg7 and produces
// build/libs/csgobox-forge-1.20.1-<version>-srg.jar, which is the artifact to
// ship for Forge 1.20.1.
renamer.mappings.from minecraft.dependency.toSrgFile

renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = 'srg'
}

// The renamer plugin defaults its tool launcher to Java 8; pin the reobf task
// to the module's own Java 17 toolchain instead (the renamer CLI is a plain
// executable and runs fine; Java 8 remains reserved for the slime-launcher
// game tasks, which need it at task-creation time and can't be overridden).
tasks.named('renameJar').configure {
    javaLauncher.set(javaToolchains.launcherFor { spec ->
        spec.languageVersion.set(JavaLanguageVersion.of(17))
    })
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

tasks.named('processResources', ProcessResources).configure {
    // gradle.properties 是 UTF-8；Java Properties 默认按 ISO-8859-1 解析，
    // 会使 description 中的中文在 expand 后双重编码乱码。用 UTF-8 显式重读覆盖。
    def utf8RootProps = new Properties()
    rootProject.file('gradle.properties').withReader('UTF-8') { reader -> utf8RootProps.load(reader) }

    var replaceProperties = [
            minecraft_version: mc_version_forge_1_20_1,
            minecraft_version_range: minecraft_version_range_forge_1_20_1,
            pack_format: pack_format_forge_1_20_1,
            forge_version: forge_version_forge_1_20_1,
            forge_version_range: forge_version_range_forge_1_20_1,
            loader_version_range: loader_version_range_forge_1_20_1,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: utf8RootProps.getProperty('mod_description'),
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-forge-${mc_version_forge_1_20_1}-${version}.jar"
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
        ])
    }
    // Stale incremental-javac leftovers (anonymous-class revisions) appear as
    // "Foo 2.class" (space form) or "Foo+2.class" (plus form). Both predicates
    // mirror purgeStaleBuildResources so classes/ and resources/ are filtered
    // consistently.
    exclude { it.name ==~ /.+[ ][0-9]+(\..+)?/ || it.name ==~ /.+\+[0-9]+(\..+)?/ }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
