<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="CS2-Box 宝箱配置编辑器：可视化创建 config/csbox 下的宝箱 / 终端机与统一价格表（纯前端、可离线、GitHub Pages 在线可用）">
<meta property="og:title" content="CS2-Box 宝箱配置编辑器">
<meta property="og:description" content="可视化创建 CS2-Box 宝箱 / 终端机配置与统一价格表">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wikkd.github.io/CS2-Box/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90' fill='%23b5732f'%3E%E2%96%A3%3C/text%3E%3C/svg%3E">
<title>CS2-Box Box Config Editor</title>
<link rel="stylesheet" href="css/style.css?v=__VER__">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">▣</span>
    <div class="brand-text">
      <h1 id="app-title">CS2-Box Box Config Editor</h1>
      <p id="app-subtitle"></p>
    </div>
  </div>
  <div class="topbar-controls">
    <label class="ctl"><span id="lang-label"></span>
      <select id="lang-select">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </label>
    <label class="ctl"><span id="version-label"></span>
      <select id="version-select"></select>
    </label>
    <button id="btn-undo" class="btn small" data-action="undo">Undo</button>
    <button id="btn-redo" class="btn small" data-action="redo">Redo</button>
    <button id="btn-new" class="btn">New</button>
    <button id="btn-import" class="btn">Import</button>
    <button id="btn-import-legacy" class="btn">Legacy Import</button>
    <button id="btn-example" class="btn accent">Examples</button>
    <button id="btn-share" class="btn small" data-action="share">Share</button>
    <label class="chk advanced-toggle" title=""><input type="checkbox" id="advanced-toggle"><span id="advanced-label"></span></label>
  </div>
</header>

<main class="layout">
  <section class="left column" id="form-root"></section>

  <aside class="right column">
    <div class="preview-toolbar">
      <div class="tab-row page-nav">
        <a id="nav-box" class="tab" href="index.html" data-nav="box">Box Config</a>
        <a id="nav-prices" class="tab" href="prices.html" data-nav="prices">Prices</a>
      </div>
      <div class="preview-actions">
        <label class="chk" title=""><input type="checkbox" id="compact-toggle" checked><span id="compact-label"></span></label>
        <button class="btn small" data-action="copy" id="btn-copy">Copy</button>
        <button class="btn small" data-action="download" id="btn-download">Download</button>
        <button class="btn small accent" data-action="download-all" id="btn-download-all">All</button>
      </div>
    </div>
    <div class="path-hint" id="path-hint"></div>
    <div class="tab-row view-switch" id="view-switch" role="tablist" aria-label="preview view">
      <button id="view-json" class="tab active" role="tab" aria-selected="true">JSON</button>
      <button id="view-prob" class="tab" role="tab" aria-selected="false">Probabilities</button>
    </div>
    <pre class="json-preview" id="json-preview"></pre>
    <section id="prob-panel" class="prob-panel" hidden></section>
    <section class="issues" id="issues-root"></section>
  </aside>
</main>

<footer class="foot" id="app-foot"></footer>

<input type="file" id="file-input" accept=".json,application/json" hidden>

<dialog id="import-dialog" class="dlg">
  <h2 id="import-title">Paste JSON</h2>
  <textarea id="import-textarea" rows="10" class="grow"></textarea>
  <div class="dlg-actions">
    <button class="btn" id="import-cancel">Cancel</button>
    <button class="btn accent" id="import-do">Import</button>
  </div>
</dialog>

<dialog id="legacy-dialog" class="dlg">
  <h2 id="legacy-title">Legacy Import</h2>
  <p class="help" id="legacy-hint"></p>
  <textarea id="legacy-textarea" rows="10" class="grow"></textarea>
  <div class="dlg-actions">
    <button class="btn" id="legacy-file-btn">Choose file</button>
    <button class="btn" id="legacy-cancel">Cancel</button>
    <button class="btn accent" id="legacy-do">Legacy Import</button>
  </div>
</dialog>

<input type="file" id="legacy-file-input" accept=".json,application/json" hidden>

<dialog id="example-dialog" class="dlg">
  <h2 id="example-title">Examples</h2>
  <ul class="example-list" id="example-list"></ul>
  <div class="dlg-actions">
    <button class="btn" id="example-close">Close</button>
  </div>
</dialog>

<dialog id="tutorial-dialog" class="dlg">
  <h2 id="tutorial-title">Tutorial</h2>
  <div id="tutorial-body" class="tutorial-body"></div>
  <div class="dlg-actions">
    <button class="btn" id="tutorial-close">Close</button>
  </div>
</dialog>

<dialog id="paste-dialog" class="dlg">
  <h2 id="paste-title">Paste</h2>
  <textarea id="paste-textarea" rows="8" class="grow"></textarea>
  <p class="help" id="paste-hint"></p>
  <div class="dlg-actions">
    <button class="btn" id="paste-cancel">Cancel</button>
    <button class="btn accent" id="paste-do">OK</button>
  </div>
</dialog>

<div id="toast" class="toast"></div>

<datalist id="csbox-entity-list" hidden></datalist>

<script src="js/i18n.js?v=__VER__"></script>
<script src="js/data.js?v=__VER__"></script>
<script src="js/model.js?v=__VER__"></script>
<script src="js/validator.js?v=__VER__"></script>
<script src="js/app.js?v=__VER__"></script>
</body>
</html>
