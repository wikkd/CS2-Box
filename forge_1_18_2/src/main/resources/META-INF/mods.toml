modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/wikkd/CS2-Box/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://gitee.com/hou-xiangling/CS2-Box/tree/main/docs/tutorials"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 1.18.2 compat matrix (queried 2026-10-24): JEI 10.x / REI 8.x / Jade 5.x /
# Cloth Config 6.x exist for Forge 1.18.2. EMI, WTHIT and The One Probe have
# no MC 1.18.2 builds, so no optional-dep entries for them here (hover info
# is covered by Jade; see docs/PORTING-forge-1182.md).

[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[10,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="roughlyenoughitems"
    mandatory=false
    versionRange="[8.0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="jade"
    mandatory=false
    versionRange="[5.0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="cloth_config"
    mandatory=false
    versionRange="[6.0,)"
    ordering="NONE"
    side="CLIENT"
