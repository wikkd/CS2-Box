// Forge 1.18.2 platform module — port of forge_1_20_1 (ForgeGradle 7 line).
//
// Same build skeleton as forge_1_20_1 (FG7 mavenizer + SRG renamer for the
// production jar). Key 1.18.2 differences are documented in
// docs/PORTING-forge-1182.md; the headline item: MC 1.18.2 has NO GuiGraphics,
// so every GUI file is a PoseStack rewrite (AnimRenderOps absorbs the render
// primitives).
//
// 1.18.2 compat matrix (queried 2026-10-24): JEI 10.x / REI 8.x / Jade 5.x /
// Cloth Config 6.x / TACZ 1.1.4 exist. EMI, WTHIT and The One Probe have NO
// MC 1.18.2 builds — those packages are not ported and the shared-source
// mcshared/wthit tree is excluded from this module's compile.
// Create 1.18.2-0.5.1.i exists but the deployer-recipe API shape differs from
// 6.0.x — the create/ package is not ported in the first pass (the recycler
// stays automatable through vanilla hoppers via WorldlyContainer).

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    // Pinned concrete version (same rationale as forge_1_20_1).
    id 'net.minecraftforge.gradle' version "${forgegradle_version_forge_1_18_2}"
    // SRG reobfuscation for the 1.18.2 production jar (official → SRG).
    id 'net.minecraftforge.renamer' version '1.1.7'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-forge-${mc_version_forge_1_18_2}"
}

// MC 1.18.2 ships Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            // slime-launcher needs this on the 1.18.2 line (BootstrapLauncher
            // unreflect access is blocked by default JPMS settings).
            jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'
            if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')) {
                jvmArgs '-XstartOnFirstThread'
            }
        }
        register('client') {
            if (project.hasProperty('gameDir')) {
                workingDir = project.file(project.property('gameDir'))
            }
        }
        register('server') {
            args '--nogui'
        }
        register('gameTestServer')
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'src/main/resources'
    srcDir project(':common').file('src/main/resources')
}

sourceSets.main.java {
    srcDir project(':common').file('src/main/java')
    srcDir project(':common').file('src/main/mcshared')
    // No WTHIT build exists for MC 1.18.2 — the shared WTHIT provider cannot
    // compile here (it imports the waila API).
    exclude 'com/reclizer/csgobox/mcshared/wthit/**'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // 1.18.2 worldgen datapack (village-injection) uses the 1.18.2 format:
    // pools carry root "name" (+ element names), the configured structure is
    // nested-"config" style, NBT templates live under structures/ (plural) and
    // the configured registry is worldgen/configured_structure_feature. The
    // 1.19+-layout shared files (structure/, flat configured JSON) stay
    // excluded. See docs/PORTING-forge-1182.md.
    exclude 'data/csgobox/worldgen/structure/**'
    exclude 'data/csgobox/structure/**'
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven {
        name = 'LocalPatchedLibraries'
        url = rootProject.file('local-repo')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://modmaven.dev' }
    maven { url = 'https://maven.shedaniel.me' }
    maven {
        name = 'ModrinthMaven'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // Jade 1.18.2 via CurseForge (cdn.modrinth.com is unreachable from this
    // machine; the Modrinth maven redirects there). File id 5079263 =
    // Jade-1.18.2-forge-5.3.2.
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

// TACZ 1.18.2 compile-only API stub, built in-tree. The real production jar
// (SRG-mapped) cannot sit on this Mojang-mapped dev classpath, so the module
// compiles against signature stubs from scripts/tacz-stub-1182-src
// (TimelessAPI / IGun / attachment enum / index POJOs; descriptors verified
// against TACZ's 1.18.2 branch source, runtime targets TACZ 1.1.4-hotfix and
// every touchpoint sits behind ModList.isLoaded("tacz")). The stub jar joins
// compileJava's classpath as a files() collection (task-built, so a fresh
// clone builds with zero local-repo setup — this replaces the old
// com.tacz:tacz:1.1.8-api-1182 coordinate whose jar was gitignored and its
// sources uncommitted). The stub compile itself uses configurations.compile
// Classpath, which already carries the mapped Minecraft artifact via the
// implementation dependency and cannot cycle (the stub is appended AFTER
// that configuration, never inside it).
def taczStubClasses = tasks.register('taczStubClasses', JavaCompile) {
    source = rootProject.fileTree('scripts/tacz-stub-1182-src') {
        include '**/*.java'
    }
    classpath = configurations.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('tacz-stub-classes')
    options.encoding = 'UTF-8'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def taczStubJarTask = tasks.register('taczStubJar', Jar) {
    group = 'build'
    description = 'Builds the TACZ 1.18.2 compile-only API stub jar from scripts/tacz-stub-1182-src.'
    dependsOn taczStubClasses
    from layout.buildDirectory.dir('tacz-stub-classes')
    archiveFileName = 'tacz-1.1.8-api-1182.jar'
    destinationDirectory = layout.buildDirectory.dir('tacz-stub')
}

tasks.named('compileJava', JavaCompile).configure {
    classpath += files(taczStubJarTask)
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${mc_version_forge_1_18_2}-${forge_version_forge_1_18_2}")

    // TACZ (Timeless & Classics Guns: Zero, official 1.18.2 line) — optional
    // compile-only dependency (the in-tree stub jar; see the tasks above) for
    // TACZ item validation and the /csbox tacz listing. Guarded at runtime via
    // ModList.isLoaded("tacz").

    // JEI 10.x (single artifact on 1.18.2 — the -forge-api/-common-api split
    // started with JEI 15 on MC 1.20.1). Discovery is @JeiPlugin annotation
    // scanning. runtimeOnly only behind -PwithJei (SRG-name I18n limitation,
    // same as forge_1_20_1).
    compileOnly "mezz.jei:jei-${mc_version_forge_1_18_2}-forge:${jei_version_forge_1_18_2}"
    if (project.hasProperty('withJei')) {
        runtimeOnly "mezz.jei:jei-${mc_version_forge_1_18_2}-forge:${jei_version_forge_1_18_2}"
    }

    // REI 8.x — plugin API; discovery is @REIPluginClient annotation scanning.
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version_forge_1_18_2}"
    if (project.hasProperty('withRei')) {
        runtimeOnly "me.shedaniel:RoughlyEnoughItems-forge:${rei_version_forge_1_18_2}"
    }

    // Jade 5.x — hover overlay; discovery is @WailaPlugin annotation scanning.
    compileOnly "curse.maven:jade-324717:5079263"  // Jade-1.18.2-forge-5.3.2 (cursemaven; Modrinth CDN unreachable here)

    // Cloth Config 6.x (optional client config GUI over ForgeConfigSpec).
    compileOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version_forge_1_18_2}"
    runtimeOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version_forge_1_18_2}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ===== SRG reobfuscation for the production jar (official → SRG) =====
// Same contract as forge_1_20_1: ship build/libs/csgobox-forge-1.18.2-<version>-srg.jar.
renamer.mappings.from minecraft.dependency.toSrgFile

renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = 'srg'
}

tasks.named('renameJar').configure {
    javaLauncher.set(javaToolchains.launcherFor { spec ->
        spec.languageVersion.set(JavaLanguageVersion.of(17))
    })
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

tasks.named('processResources', ProcessResources).configure {
    def utf8RootProps = new Properties()
    rootProject.file('gradle.properties').withReader('UTF-8') { reader -> utf8RootProps.load(reader) }

    var replaceProperties = [
            minecraft_version: mc_version_forge_1_18_2,
            minecraft_version_range: minecraft_version_range_forge_1_18_2,
            pack_format: pack_format_forge_1_18_2,
            forge_version: forge_version_forge_1_18_2,
            forge_version_range: forge_version_range_forge_1_18_2,
            loader_version_range: loader_version_range_forge_1_18_2,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: utf8RootProps.getProperty('mod_description'),
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-forge-${mc_version_forge_1_18_2}-${version}.jar"
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
        ])
    }
    exclude { it.name ==~ /.+[ ][0-9]+(\..+)?/ || it.name ==~ /.+\+[0-9]+(\..+)?/ }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Slim builds drop LocalVariableTable (keeps LineNumberTable for crash
    // reports). Default builds are untouched.
    if (project.hasProperty('slim')) {
        options.debugOptions.debugLevel = 'lines,source'
    }
}

// Same issue #2 dist guard as every other platform.
tasks.register('checkDistSafety') {
    group = 'verification'
    description = 'Issue #2 guard: entry class must not reference client-only types (dedicated-server dist crash).'
    dependsOn tasks.named('compileJava')
    // FG7 merge-source-sets puts processResources output in the same tree
    // the candidates scan — declare the dependency or Gradle 9 fails validation.
    dependsOn tasks.named('processResources')
    def candidates = [layout.buildDirectory.file("classes/java/main/com/reclizer/csgobox/${project.name}/CsgoBox.class").get().asFile,
                      layout.buildDirectory.file("sourceSets/main/com/reclizer/csgobox/${project.name}/CsgoBox.class").get().asFile]
    inputs.files(candidates)
    doLast {
        def f = candidates.find { it.isFile() }
        if (f == null) {
            throw new GradleException("checkDistSafety: entry class not found (tried ${candidates*.path.join(', ')}) — was compileJava run?")
        }
        def bytes = f.bytes
        def needle = 'net/minecraft/client'.getBytes('UTF-8')
        int count = 0
        for (int i = 0; i <= bytes.length - needle.length; i++) {
            boolean hit = true
            for (int j = 0; j < needle.length; j++) {
                if (bytes[i + j] != needle[j]) { hit = false; break }
            }
            if (hit) { count++ }
        }
        if (count > 0) {
            throw new GradleException(
                "checkDistSafety FAILED: ${f.name} constant pool references net/minecraft/client (${count} occurrence(s)).")
        }
        logger.lifecycle "checkDistSafety: ${f.name} clean (no client-only type references)"
    }
}
tasks.named('check').configure { dependsOn(tasks.named('checkDistSafety')) }

// Dump the compile classpath for external javac invocation (TACZ API stub build).
tasks.register('dumpCompileClasspath') {
    doLast {
        configurations.compileClasspath.resolve().each { f ->
            println "CP:" + f.absolutePath
        }
    }
}
